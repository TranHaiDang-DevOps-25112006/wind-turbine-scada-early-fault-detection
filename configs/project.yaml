project:
  name: wind_turbine_scada_early_fault_detection
  random_seed: 42
  timezone: UTC

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  sample_dir: data/sample
  csv_sep: ";" # Dấu phân cách thực tế của CARE To Compare
  timestamp_column: time_stamp # Đã xác nhận từ file SCADA thực tế
  asset_id_column: asset_id # Đã xác nhận: mã tua-bin (asset_id)
  row_id_column: id # Đã xác nhận: mã thứ tự dòng (id)
  status_column: status_type_id # Đã xác nhận: trạng thái vận hành (0 = normal)
  split_column: train_test # Đã xác nhận: phân chia 'train' và 'prediction'

model:
  primary: isolation_forest
  contamination: 0.01
  n_estimators: 200
  random_state: 42

alert:
  threshold_strategy: validation_quantile
  consecutive_points: 3
  cooldown_points: 6
  note: "Các ngưỡng trên là giá trị khởi đầu để thử nghiệm, không phải thông số vận hành an toàn."
